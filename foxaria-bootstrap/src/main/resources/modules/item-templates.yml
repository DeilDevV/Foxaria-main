# Лаборатория шаблонов: /itemtemplate gui (список, редактор руки, YAML — одно окно)
# Эффекты при ударе (PDC): «на врага» и «на себя». Учитываются обе руки, броня, лук/арбалет, трезубец.
on-hit-effects:
  enabled: true
editor:
  durability-step: 10
  attack-damage-step: 0.5
  attack-speed-step: 0.05
  attack-knockback-step: 0.05
  armor-step: 1.0
  armor-toughness-step: 0.5
  knockback-resistance-step: 0.05
  # Шаги для GUI зелий (тики = 1/20 с)
  potion-duration-step-ticks: 20
  potion-extend-all-step-ticks: 100
