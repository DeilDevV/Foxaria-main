enabled: true
default-group: default
cleanup-interval-ticks: 1200
proxy-bridge:
  enabled: true
  # Путь до SQLite БД proxy-плагина с привилегиями (группами).
  # Относительный путь считается от plugins/Foxaria/.
  # Таблица с группами прокси в той же общей БД, что и основной Foxaria.
  table: "proxy_privileges"
groups:
  default:
    display-name: "Игрок"
    prefix: "&7Игрок &8| &f"
    inherits: []
    permissions:
      - foxaria.spawn
      - foxaria.rtp
      - foxaria.menu
      - foxaria.home
      - foxaria.home.set
      - foxaria.home.delete
      - foxaria.home.list
      - foxaria.tpa
      - foxaria.tpaccept
      - foxaria.tpdeny
      - foxaria.tpahere
      - foxaria.economy.balance
      - foxaria.economy.balance.top
      - foxaria.economy.pay
      - foxaria.kits.use
      - foxaria.shop.use
      - foxaria.playershops.use
      - foxaria.auction.use
      - foxaria.customitems.use
      - foxaria.rewards.use
      - foxaria.streak.use
      - foxaria.voteclaim.use
      - foxaria.refer.use
      - foxaria.season.use
      - foxaria.report
  supporter:
    display-name: "Поддержка"
    prefix: "&aПоддержка &8| &f"
    inherits:
      - default
    permissions:
      - foxaria.kits.use.daily
  vip:
    display-name: "VIP"
    prefix: "&6VIP &8| &f"
    inherits:
      - supporter
    permissions:
      - foxaria.kits.use.vip
  elite:
    display-name: "Элита"
    prefix: "&bЭлита &8| &f"
    inherits:
      - vip
    permissions:
      - foxaria.economy.balance.others
  helper:
    display-name: "Хелпер"
    prefix: "&2Хелпер &8| &f"
    inherits:
      - default
    permissions:
      - foxaria.mod.panel
      - foxaria.mod.history
      - foxaria.mod.note
      - foxaria.mod.staffchat
      - foxaria.mod.vanish.see
  moderator:
    display-name: "Модератор"
    prefix: "&3Модератор &8| &f"
    inherits:
      - helper
    permissions:
      - foxaria.mod.check
      - foxaria.mod.warn
      - foxaria.mod.mute
      - foxaria.mod.tempmute
      - foxaria.mod.kick
      - foxaria.mod.ban
      - foxaria.mod.punish
      - foxaria.mod.tempban
      - foxaria.mod.freeze
      - foxaria.mod.socialspy
      - foxaria.mod.commandspy
      - foxaria.mod.invsee
      - foxaria.mod.echest
      - foxaria.mod.vanish
      - foxaria.speed
      - foxaria.playershops.inspect
  admin:
    display-name: "Админ"
    prefix: "&cАдмин &8| &f"
    inherits:
      - moderator
    permissions:
      - foxaria.rank.admin.moderation
      - foxaria.setspawn
      - foxaria.economy.admin
      - foxaria.ranks.manage
      - foxaria.store.manage
      - foxaria.admin.panel
      - foxaria.admin.maintenance
      - foxaria.admin.restart
      - foxaria.admin.auditlog
      - foxaria.security.admin
      - foxaria.security.grimhook
      - foxaria.customitems.admin
