name: Foxaria
version: 0.1.0-SNAPSHOT
main: com.foxaria.bootstrap.FoxariaBootstrapPlugin
api-version: "1.21.11"
author: Fox Designer
commands:
  help:
    description: "Показать доступные команды Foxaria"
  register:
    description: "Зарегистрировать аккаунт"
  login:
    description: "Войти в аккаунт"
  spawn:
    description: "Телепортация на спавн"
  setspawn:
    description: "Установить спавн"
  rtp:
    description: "Случайная телепортация"
  home:
    description: "Телепортация в дом"
  sethome:
    description: "Установить дом"
  delhome:
    description: "Удалить дом"
  homes:
    description: "Список домов"
  tpa:
    description: "Отправить запрос на телепортацию"
  tpaccept:
    description: "Принять запрос на телепортацию"
  tpdeny:
    description: "Отклонить запрос на телепортацию"
  tpahere:
    description: "Попросить игрока телепортироваться к вам"
  menu:
    description: "Открыть главное меню сервера"
  server:
    description: "Открыть выбор сервера"
  speed:
    description: "Установить скорость передвижения и полёта"
  permdebug:
    description: "Отладка прав игрока (группа + список нод)"
  bal:
    description: "Посмотреть баланс"
  pay:
    description: "Перевести валюту"
  baltop:
    description: "Топ по балансу"
  eco:
    description: "Администрирование экономики (give/take/set)"
    permission: foxaria.economy.admin
  kit:
    description: "Получить набор"
  kits:
    description: "Открыть список наборов"
  shop:
    description: "Магазин за монеты (уровень знаний открывает товары)"
    permission: foxaria.shop.use
  token:
    description: "Баланс токенов (отдельная валюта, донат-магазин)"
    permission: foxaria.economy.token
  quest:
    description: "Квесты и уровень знаний"
    permission: foxaria.quest.use
  adminquestshop:
    description: "Админ: товары магазина знаний"
    permission: foxaria.questshop.admin
  donateshop:
    description: "Донат-магазин за токены"
    aliases: [dshop, dstore]
    permission: foxaria.donateshop.use
  kitadmin:
    description: "Админ: наборы из инвентаря"
    permission: foxaria.kits.admin
  ah:
    description: "Открыть аукцион"
  storegrant:
    description: "Постановка донат-пакета в очередь"
  warn:
    description: "Выдать предупреждение"
  mute:
    description: "Выдать мут"
  unmute:
    description: "Снять мут"
  tempmute:
    description: "Выдать временный мут"
  kick:
    description: "Кикнуть игрока"
  ban:
    description: "Забанить игрока"
  unban:
    description: "Снять бан"
  tempban:
    description: "Выдать временный бан"
  freeze:
    description: "Заморозить игрока"
  unfreeze:
    description: "Снять заморозку"
  check:
    description: "Вызвать игрока на проверку"
  uncheck:
    description: "Завершить проверку игрока"
  report:
    description: "Пожаловаться на игрока"
  staffchat:
    description: "Чат администрации"
  socialspy:
    description: "Переключить social spy"
  commandspy:
    description: "Переключить command spy"
  invsee:
    description: "Просмотр инвентаря игрока"
  echest:
    description: "Просмотр эндер-сундука игрока"
  vanish:
    description: "Переключить vanish"
  history:
    description: "История наказаний игрока"
  note:
    description: "Добавить заметку по игроку"
  punish:
    description: "Наказание по коду причины (каталог в modules/moderation.yml)"
  unpunish:
    description: "Снять все активные санкции с игрока (мут, бан, заморозка)"
  modpanel:
    description: "Открыть панель модерации"
  adminpanel:
    description: "Открыть админ-панель"
  maintenance:
    description: "Переключить режим техработ"
  restartcountdown:
    description: "Запустить таймер рестарта"
  auditlog:
    description: "Посмотреть аудит-лог"
  security:
    description: "Диагностика безопасности"
  grimhook:
    description: "Внутренний мост античита"
  crate:
    description: "Открыть и управлять кейсами"
  rewards:
    description: "Получить награды за время и активность"
    aliases: [reward]
  streak:
    description: "Посмотреть серию входов"
  voteclaim:
    description: "Получить награду за голосование"
  refer:
    description: "Активировать реферала"
  season:
    description: "Информация о текущем сезоне"
  foxreload:
    description: "Перезагрузить Foxaria с диска (без рестарта сервера)"
    permission: foxaria.admin.reload
  guild:
    description: "Система гильдий"
    aliases: [g]
  g:
    description: "Система гильдий"
  itemtemplate:
    description: "Админ: шаблоны предметов (GUI и сохранение в БД)"
    aliases: [itpl]
  itpl:
    description: "Алиас шаблонов предметов"
  region:
    description: "Приватные регионы (ядро привата)"
    aliases: [rg]
  craft:
    description: "Меню крафтов Foxaria"
  raid:
    description: "Динамит рейда: выдача админам (/raid give)"
  adminfoxcraft:
    description: "Админ: редактор серверных крафтов (верстак)"
    permission: foxaria.craft.admin
  adminfurnaces:
    description: "Админ: модернизированная печь и ключ труб"
    permission: foxaria.modernfurnace.admin
  regionadmin:
    description: "Админ приватов: список, tp, delete, purge"
    permission: foxaria.region.admin
permissions:
  foxaria.admin.reload:
    description: "Перезагрузка плагина Foxaria с диска"
    default: op
  foxaria.guild.use:
    description: "Использование интерфейса гильдий"
    default: true
  foxaria.guild.create:
    description: "Создание гильдии"
    default: true
  foxaria.guild.war.admin:
    description: "Администрирование арен и войн гильдий"
    default: op
  foxaria.itemtemplate.admin:
    description: "Создание и управление глобальными шаблонами предметов"
    default: op
  foxaria.region.use:
    description: "Команды /region, /craft и подсказка /raid"
    default: true
  foxaria.region.admin:
    description: "Админ-команды приватов (/regionadmin)"
    default: op
  foxaria.region.dynamite.give:
    description: "Выдача динамита рейда (/raid give)"
    default: op
  foxaria.craft.admin:
    description: "Редактор крафтов /adminfoxcraft"
    default: op
  foxaria.modernfurnace.admin:
    description: "Выдача модернизированной печи и ключа"
    default: op
  foxaria.economy.admin:
    description: "Команда /eco give|take|set и токены"
    default: op
  foxaria.economy.token:
    description: "Команда /token — свой баланс токенов"
    default: true
  foxaria.economy.token.others:
    description: "Просмотр чужих токенов через /token"
    default: op
  foxaria.shop.use:
    description: "Команда /shop"
    default: true
  foxaria.quest.use:
    description: "Команда /quest"
    default: true
  foxaria.questshop.admin:
    description: "Админ: /adminquestshop"
    default: op
  foxaria.kits.admin:
    description: "Создание и удаление наборов (/kitadmin)"
    default: op
  foxaria.donateshop.use:
    description: "Открытие донат-магазина"
    default: true
  foxaria.donateshop.admin:
    description: "Управление товарами донат-магазина"
    default: op
  foxaria.permdebug:
    description: "Отладка системы прав (/permdebug)"
    default: op
  foxaria.rank.admin.moderation:
    description: "Группа Админ — панели /modpanel и /adminpanel и весь стандартный набор мод-инструментов"
    default: op
    children:
      foxaria.mod.punish: true
      foxaria.mod.unpunish: true
      foxaria.mod.panel: true
      foxaria.mod.history: true
      foxaria.mod.note: true
      foxaria.mod.staffchat: true
      foxaria.mod.vanish.see: true
      foxaria.mod.check: true
      foxaria.mod.warn: true
      foxaria.mod.mute: true
      foxaria.mod.tempmute: true
      foxaria.mod.kick: true
      foxaria.mod.ban: true
      foxaria.mod.tempban: true
      foxaria.mod.freeze: true
      foxaria.mod.socialspy: true
      foxaria.mod.commandspy: true
      foxaria.mod.invsee: true
      foxaria.mod.echest: true
      foxaria.mod.vanish: true
      foxaria.admin.panel: true
