  backend-database:
    # false = только локальный SQLite прокси (бан через /punish на прокси снимается всегда). true = та же MySQL, что Paper.
    enabled: false
    jdbc-url: ""
    type: mysql
    host: 127.0.0.1
    port: 3306
    name: foxaria
    username: foxaria
    password: Grnkbq2GS7rBj71TWmx
    file: foxaria.db
  staff-groups:
    - admin
    - moderator
    - helper
  screen:
    message: "&6&lFOXARIA\n%block_notice%\n&cПричина: &f%reason_title%\n&7%reason_description%\n&eСрок: &f%expires%\n&cВыдал: &f%actor%"
  messages:
    punish-no-proxy-permission: "&cНет прав."
    unpunish-no-proxy-permission: "&cНет прав."
    unpunish-resolve: "&7Поиск UUID для &f%player%&7…"
    unpunish-unknown: "&cНе удалось найти игрока &f%player%&c (ник не существует или Mojang недоступен)."
    punish-resolve: "&7Поиск UUID для &f%player%&7…"
    punish-unknown: "&cНе удалось найти игрока &f%player%&c (ник не существует или Mojang недоступен)."
    unpunish-nothing: "&cНет активных санкций для этого игрока."
    unpunish-backend-error: "&cИгровая БД недоступна: &f%err%&c. На прокси записей не найдено."
    unpunish-backend-partial: "&eИгровая БД недоступна — снимаю только санкции прокси (SQLite)."
    unpunish-offline-fallback: "&eMojang недоступен — ищу санкции по offline-UUID."
    unpunish-ok: "&aСнято записей: &f%n% &a(прокси: &f%np%&a, игровые: &f%nb%&a) у игрока &f%player%&a."
    punish-offline-fallback: "&eMojang недоступен — наказание по offline-UUID."
