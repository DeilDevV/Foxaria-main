    punish-applied: "&aНаказание %code% выдано игроку %player%."
    muted: "&cВаш чат ограничен мутом: &f%reason%"
    rules-header: "&6&lFOXARIA &8» &fПричины наказаний"
    rules-line: "&e%code% &8• &f%title% &8• &7%type% &8• &f%sanction%\n&8  %text%"
  reasons:
    "1.1":
      type: TEMPBAN
      duration-seconds: 604800
      title: "Читы"
      description: "Использование стороннего ПО, дающего преимущество в игре."
      rules-text: "Читы, X-Ray, автокликеры, трейнеры и другое стороннее ПО."
    "2.1":
      type: TEMPMUTE
      duration-seconds: 7200
      title: "Оскорбления"
      description: "Оскорбительное поведение, токсичность и провокации в чате."
      rules-text: "Оскорбления игроков, администрации, провокации и токсичное общение."

tab:
  enabled: true
  brand-word: "FOXARIA"
  update-period-ms: 2000
  # Гильдия в табе только на этих серверах Bungee (лобби/auth — без тега гильдии)
  guild-tab-servers:
    - test-game
  # %commands% — опционально: подсказки из command-hints для текущего backend (имя сервера в bungee.yml).
  header: "%brand%\n&7Онлайн: &f%online% &8| &7РЕЖИМ: &#FFAA55%mode%%commands%"
  footer: "&7Привилегия: %rank_colored%"
  server-modes:
    auth: "АВТОРИЗАЦИЯ"
    lobby: "LOBBY"
    test-game: "АНАРХИЯ"
  command-hints:
    # Fallback, если для сервера нет своей строки
    _default: ""
    auth: "&8» &7Команды: &#FFAA55/login &8· &f/l &8· &#FFAA55/register &8· &f/r"
    lobby: "&8» &7Команды: &#FFAA55/menu &8· &f/lobby &8· &f/help"
    test-game: "&8» &7Команды: &#FFAA55/menu &8· &f/shop &8· &f/guild"

