network:
  config-version: 2
  auth-server: auth
  lobby-server: lobby
  game-servers:
    - test-game
  force-auth-on-join: true
  server-picker-order:
    - lobby
    - test-game
  server-picker-skip: [ ]
  server-picker:
    lobby:
      title: "Лобби"
      hint: "меню, /lobby, /server"
    test-game:
      title: "Выживание"
      hint: "гильдии, /shop, /menu"
  server-capacity:
    test-game: 200

auth:
  session-timeout-seconds: 18000
  session-require-same-ip: true
  login-command-cooldown-ms: 1500
  max-login-attempts-per-window: 6
  login-attempt-window-ms: 30000
  min-password-length: 6
  max-password-length: 64
  titles:
    enabled: true
    success-brand-word: "Готово"
    need-login-title: "%brand%"
    need-login-subtitle: "&#FFAA55/login &7пароль  &7или  &#FFAA55/l"
    need-register-title: "%brand%"
    need-register-subtitle: "&#FFAA55/register &7пароль повтор  &7или  &#FFAA55/r"
    success-title: "%brand_ok%"
    success-subtitle: "&fДобро пожаловать!"
  messages:
    need-login: "%brand% &8» &fВойди: &#FFAA55/login &fпароль &7(кратко: &#FFAA55/l&7)"
    need-register: "%brand% &8» &fРегистрация: &#FFAA55/register &fпароль повтор &7(кратко: &#FFAA55/r&7)"
    login-success: "&a✓ Вход выполнен."
    register-success: "&a✓ Регистрация завершена."
    bad-password: "&c✗ Неверный пароль."
    already-registered: "&eАккаунт уже зарегистрирован. Используй /login."
    already-authenticated: "&aВы уже авторизованы."
    not-registered: "&eАккаунт не найден. Используй /register."
    register-usage: "&eИспользование: /register <пароль> <повтор> &7(или &e/r&7)"
    login-usage: "&eИспользование: /login <пароль> &7(или &e/l&7)"
    password-mismatch: "&c✗ Пароли не совпадают."
    password-length: "&c✗ Длина пароля: от %min% до %max% символов."
    register-failed: "&c✗ Не удалось завершить регистрацию. Попробуй ещё раз."

privileges:
  default-group: default
  help-lines:
    - "&6&lFOXARIA &8» &fКоманды привилегий:"
    - "&e/mygroup &7- твоя текущая группа"
    - "&e/groupinfo <игрок> &7- подробная инфа по группе"
    - "&e/grantpriv <игрок> <группа> [секунды] &7- выдать группу"
    - "&e/revokepriv <игрок> [temp|all] &7- снять временную или все привилегии"
    - "&e/auditpriv <игрок> [limit] &7- последние выдачи/снятия"
  groups:
    default:
      prefix: "&7Игрок &8| &f"
      display-name: "Игрок"
    vip:
      prefix: "&6VIP &8| &f"
      display-name: "VIP"
    elite:
      prefix: "&bЭлита &8| &f"
      display-name: "Элита"
    helper:
      prefix: "&2Хелпер &8| &f"
      display-name: "Хелпер"
    moderator:
      prefix: "&3Модератор &8| &f"
      display-name: "Модератор"
    admin:
      prefix: "&cАдмин &8| &f"
      display-name: "Админ"
  messages:
    grant-usage: "&eИспользование: /grantpriv <игрок> <группа> [секунды]"
    revoke-usage: "&eИспользование: /revokepriv <игрок> [temp|all]"
    groupinfo-usage: "&eИспользование: /groupinfo <игрок>"
    unknown-group: "&cНеизвестная группа: %group%"
    bad-duration: "&cСрок должен быть числом (секунды)."
    primary-granted: "&a✓ Выдана группа &f%group%&a игроку &f%player%&a."
    temp-granted: "&a✓ Выдана временная группа &f%group%&a игроку &f%player%&a на &f%seconds%s&a."
    temp-revoked: "&a✓ Временная группа снята у &f%player%&a."
    all-revoked: "&a✓ Привилегии игрока &f%player% &aсброшены к группе &f%group%&a."
    groupinfo-header: "&6&lFOXARIA &8» &fПривилегии игрока &e%player%"
    groupinfo-active: "&7Активная группа: &f%group%"
    groupinfo-primary: "&7Основная группа: &f%group%"
    groupinfo-temp: "&7Временная группа: &f%group% &7до &e%time%"
    groupinfo-no-temp: "&7Временная группа: &8нет"

store:
  help-lines:
    - "&6&lFOXARIA &8» &fКоманды выдачи пакетов:"
    - "&e/grantpkg <игрок> <packageId> &7- выдать пакет через proxy"
  packages:
    vip_30d:
      action: "temp_group:vip:2592000"
    elite_30d:
      action: "temp_group:elite:2592000"
    admin_perm:
      action: "group:admin"
  messages:
    grant-usage: "&eИспользование: /grantpkg <игрок> <packageId>"
    unknown-package: "&cПакет не найден: %package%"
    bad-action: "&cНе удалось применить action: %action%"
    package-granted: "&a✓ Пакет &f%package%&a выдан игроку &f%player%&a."

audit:
  default-limit: 10
  messages:
    usage: "&eИспользование: /auditpriv <игрок> [limit]"
    empty: "&7Для игрока %player% записей пока нет."
    header: "&6&lFOXARIA &8» &fAudit для &e%player%"
    line: "&8#%id% &7[%time%] &f%action% &7by &e%actor% &8| &f%detail%"

common:
  only-player: "&cКоманда только для игроков."
  player-offline: "&cИгрок %player% не онлайн."

messages:
  network:
    already-in-lobby: "&eВы уже находитесь в лобби."
    to-lobby: "&aПереносим в лобби..."
    server-restarting-to-lobby: "&eСервер отключён/перезагружается. Переносим в лобби..."
    lobby-from-auth-denied: "&eСначала завершите авторизацию на auth."
