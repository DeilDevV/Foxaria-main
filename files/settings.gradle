rootProject.name = 'foxaria'

// =====================================================================
//  Структура репозитория: ВЕСЬ исходный код плагина лежит в modules/
//  Логические имена проектов НЕ изменились (project(':foxaria-api') и т.д.),
//  поэтому build.gradle и build.gradle самих модулей править не нужно.
// =====================================================================
def moduleNames = [
    'foxaria-api',
    'foxaria-core',
    'foxaria-economy',
    'foxaria-kits',
    'foxaria-cases',
    'foxaria-cases-bukkit',
    'foxaria-cases-proxy',
    'foxaria-shop',
    'foxaria-donate-shop',
    'foxaria-auction',
    'foxaria-ranks',
    'foxaria-store',
    'foxaria-moderation',
    'foxaria-admin',
    'foxaria-security',
    'foxaria-custom-items',
    'foxaria-retention',
    'foxaria-auth',
    'foxaria-guilds',
    'foxaria-item-templates',
    'foxaria-regions',
    'foxaria-crafting',
    'foxaria-modern-furnace',
    'foxaria-bootstrap',
    'foxaria-proxy-bungee',
    'foxaria-hub-guard',
]

// NOTE: modules/foxaria-player-shops лежит в репозитории, но к сборке НЕ подключён
// (так было и до реструктуризации — он не был в settings.gradle).
// Чтобы включить: добавь 'foxaria-player-shops' в список выше
// и зависимость implementation project(':foxaria-player-shops') в foxaria-bootstrap.

moduleNames.each { name ->
    include name
    project(":${name}").projectDir = file("modules/${name}")
}
