    BIRCH_LOG: 100
    SPRUCE_LOG: 100
    JUNGLE_LOG: 100
    ACACIA_LOG: 100
    DARK_OAK_LOG: 100
    MANGROVE_LOG: 100
    CHERRY_LOG: 100
    CRIMSON_STEM: 100
    WARPED_STEM: 100
    CHEST: 100
    TRAPPED_CHEST: 100
    BARREL: 100
    STONE: 175
    COBBLESTONE: 175
    ENDER_CHEST: 200
    OBSIDIAN: 300

