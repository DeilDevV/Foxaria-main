
region-bounds:
  blocks-down-from-core-base: -1
  blocks-up-from-core-base: 100

core:
  max-hp: 100
  weapon-damage: 5
  min-attack-cooldown: 0.99

levels:
  "1":
    half-size-blocks: 64
    upgrade:
      coins: 25000
      wood: 500
      iron: 100
  "2":
    half-size-blocks: 128
    upgrade:
      coins: 50000
      wood: 800
      iron: 200
  "3":
    half-size-blocks: 256
    upgrade: null

cabinet-craft:
  logs-required: 32
  iron-ingots-required: 16
  wood-must-match-type: true

privat:
  rename-cost-coins: 10000
  rename-name-min-len: 2
  rename-name-max-len: 32
  dismantle-cooldown-minutes: 30
  intrusion-alert-min-level: 3
  boundary-particle-period-ticks: 15

regen:
  idle-before-ms: 300000
  tick-interval-ticks: 200
  amount-per-tick: 10

dynamite:
